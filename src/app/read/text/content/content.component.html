<nz-divider [nzText]="'READ.CONTENT.HEADER' | translate"></nz-divider>

<div nz-flex nzJustify="center">
  <div class="max-w-paragraph-text">
    @for (c of contents; track c.ordinal) {
    <div id="content-{{ c.ordinal }}">
      @if (c.isHeading) {
      <ng-container>
        <ks-heading [heading]="c" [fnByRef]="fnByRef"></ks-heading>
      </ng-container>

      } @else {
      <ng-container>
        <ks-paragraph
          [paragraph]="c"
          [fnByRef]="fnByRef"
          [summByRef]="summByRef"
        ></ks-paragraph>
      </ng-container>
      }
    </div>
    }
  </div>
</div>

<ng-container *ngIf="showUpButton">
  <nz-float-button
    nzType="default"
    [nzIcon]="icon"
    (click)="scrollTop()"
    nz-tooltip
    [nzTooltipTitle]="'COMMON.SCROLL_TOP_TOOLTIP' | translate"
  ></nz-float-button>
</ng-container>

<ng-template #icon>
  <nz-icon nzType="up" nzTheme="outline" />
</ng-template>
